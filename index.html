<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Weather Display Application</title>
  </head>
  <body>
    <div class="container">
      <h1>Weather App</h1>
      <input id="city-input" placeholder="Enter city to display weather" />
      <button id="display-w-btn">show weather</button>
      <div id="results" class="hidden">
        <h2 id="city"></h2>
        <p id="display-description"></p>
        <h3 id="display-temp"></h3>
        <h3 id="display-rain"></h3>
      </div>
      <div id="error-message" class="hidden">error fetching results..</div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
