<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Weather Display Application</title>
  </head>
  <body>
    
    <div class="container">
      <h1>Weather App</h1>
      <div class="input-container">
        <input id="city-input" placeholder="Enter city to display weather" />
        <button id="display-w-btn">show weather</button>
      </div>
      <div id="weather-info" class="hidden">
        <h2 id="city-name"></h2>
        <p id="temperature"></p>
        <p id="display-description"></p>
      </div>
      <div id="error-message" class="hidden">City not found..</div>
    </div>
    <div class="footer"></footer>

      >
    </div>
    <script src="script2.js"></script>
  </body>
</html>
